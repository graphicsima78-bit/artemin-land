<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBUNhCBLHR10Q5J7lrigRpL4CuPk-y6toY",
    authDomain: "artemin-land.firebaseapp.com",
    projectId: "artemin-land",
    storageBucket: "artemin-land.firebasestorage.app",
    messagingSenderId: "858600383992",
    appId: "1:858600383992:web:ac3066c19173397572220d",
    measurementId: "G-TD7QWNY8ME"
  };

  let db = null;
  try {
    db = getFirestore(initializeApp(firebaseConfig));
  } catch (e) {
    console.error("Firebase init error:", e);
  }

  window.saveToFirestore = async function (data, retryCount = 0) {
    if (!db) return false;
    try {
      await addDoc(collection(db, "customers"), { ...data, createdAt: new Date().toISOString() });
      return true;
    } catch (e) {
      console.error("Error adding document:", e);
      if (e.code === 'permission-denied') return false; // تکرار فایده ندارد
      if (retryCount < 3) {
        await new Promise(r => setTimeout(r, 1000));
        return window.saveToFirestore(data, retryCount + 1);
      }
      return false;
    }
  };
</script>

// ---------- ابزارها ----------
function normDigits(s) {
  return String(s || '')
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[^\d+]/g, '');
}
function vEsc(s) {
  return String(s ?? '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/;/g, '\\;').replace(/,/g, '\\,');
}
function detectDir(text) {
  return /[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/.test((text || '').trim().charAt(0)) ? 'rtl' : 'ltr';
}
function showStatus(message, type) {
  const el = $('status-msg');
  el.textContent = message;
  el.className = 'status-msg ' + type;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

// ---------- زبان ----------
function setLang(lang) {
  currentLang = lang;
  const t = translations[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t[el.dataset.i18nPh]; });
  $('btn-location-text').textContent = t.btnLocation;
  $('locationSuccess').textContent = t.locationSuccess;
  $('btn-en').classList.toggle('active', lang === 'en');
  $('btn-fa').classList.toggle('active', lang === 'fa');
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
  setType(currentType);
}

function setType(type) {
  currentType = type;
  $('type-business').classList.toggle('active', type === 'business');
  $('type-personal').classList.toggle('active', type === 'personal');
  const t = translations[currentLang];
  $('name').placeholder = type === 'business' ? t.namePlaceholderBusiness : t.namePlaceholderPersonal;
}

function handlePhotoUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    photoBase64 = e.target.result;
    $('photo-preview').src = photoBase64;
    $('photo-preview').style.display = 'block';
    $('photo-hint').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

// ---------- موقعیت ----------
async function getLocation() {
  const btn = $('locationBtn');
  const successMsg = $('locationSuccess');
  const addressField = $('address');
  const t = translations[currentLang];
  const resetBtn = () => { btn.disabled = false; btn.innerHTML = '📍 <span id="btn-location-text">' + t.btnLocation + '</span>'; };

  btn.disabled = true;
  btn.textContent = '📍 ' + t.detecting;
  successMsg.style.display = 'none';

  if (!navigator.geolocation) { alert(t.locationNotSupported); resetBtn(); return; }

  try {
    const position = await new Promise((resolve, reject) =>
      navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }));
    const lat = position.coords.latitude, lng = position.coords.longitude;
    btn.textContent = t.detectingAddress;

    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=fa,en`);
    const data = await response.json();
    if (data && data.display_name) {
      addressField.value = data.display_name;
      lastGPSLocation = { lat, lng };
      successMsg.textContent = t.locationSuccess;
      successMsg.style.display = 'block';
      setTimeout(() => { successMsg.style.display = 'none'; }, 4000);
    } else {
      throw new Error('Address not found');
    }
  } catch (error) {
    try {
      btn.textContent = t.ipLocation;
      // نکته: آدرس باید https باشد، وگرنه روی GitHub Pages مسدود می‌شود
      const ip = await (await fetch('https://ipwho.is/')).json();
      if (ip && ip.success !== false && ip.city) {
        addressField.value = `${ip.city}, ${ip.region}, ${ip.country}`;
        successMsg.textContent = t.ipSuccess;
        successMsg.style.display = 'block';
        setTimeout(() => { successMsg.style.display = 'none'; }, 4000);
      } else {
        throw new Error('IP location failed');
      }
    } catch (ipError) {
      alert(t.locationError);
    }
  }
  resetBtn();
}

// ---------- مودال نقشه ----------
function flashCopied(button) {
  const t = translations[currentLang];
  button.textContent = '✅ ' + t.infoCopied;
  button.classList.add('copied');
  setTimeout(() => { button.textContent = t.copyBtn; button.classList.remove('copied'); }, 2000);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

function openMapModal(mapType) {
  const t = translations[currentLang];
  $('modal-title').textContent = mapType === 'google' ? t.modalTitleGoogle : t.modalTitleNeshan;

  const fields = [
    { label: t.name, value: lastFormData.name },
    { label: t.title, value: lastFormData.title },
    { label: t.category, value: lastFormData.category },
    { label: t.phone, value: (lastFormData.phones || []).join(' - ') },
    { label: t.description, value: lastFormData.description }
  ];

  const box = $('modal-fields');
  box.innerHTML = '';
  fields.filter(f => f.value).forEach(f => {
    const row = document.createElement('div');
    row.className = 'modal-field-row';

    const info = document.createElement('div');
    info.className = 'modal-field-info';
    const label = document.createElement('div');
    label.className = 'modal-field-label';
    label.textContent = f.label;
    const val = document.createElement('div');
    val.className = 'modal-field-value';
    val.dir = detectDir(f.value);
    val.style.textAlign = val.dir === 'rtl' ? 'right' : 'left';
    val.textContent = f.value;
    info.append(label, val);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-copy-field';
    btn.textContent = t.copyBtn;
    btn.addEventListener('click', async () => { await copyText(f.value); flashCopied(btn); });

    row.append(info, btn);
    box.appendChild(row);
  });

  $('btn-open-google').style.display = mapType === 'google' ? 'block' : 'none';
  $('btn-open-neshan').style.display = mapType === 'neshan' ? 'block' : 'none';
  $('mapModal').classList.add('active');
}

function closeModal() { $('mapModal').classList.remove('active'); }
$('mapModal').addEventListener('click', e => { if (e.target === $('mapModal')) closeModal(); });

// ---------- ساخت vCard ----------
function buildVCard(d) {
  let v = 'BEGIN:VCARD\r\nVERSION:3.0\r\n';
  v += 'N:' + vEsc(d.name) + ';;;;\r\n';       // N در vCard 3.0 الزامی است
  v += 'FN:' + vEsc(d.name) + '\r\n';
  if (d.type === 'business') v += 'ORG:' + vEsc(d.name) + '\r\n';
  if (d.title) v += 'TITLE:' + vEsc(d.title) + '\r\n';
  if (d.description) v += 'NOTE:' + vEsc(d.description) + '\r\n';
  d.phones.forEach((p, i) => { v += 'TEL;TYPE=' + (i === 0 ? 'CELL' : 'WORK') + ':' + p + '\r\n'; });
  if (d.address) v += 'ADR;TYPE=WORK:;;' + vEsc(d.address) + ';;;;\r\n';
  if (d.category) v += 'CATEGORIES:' + vEsc(d.category) + '\r\n';
  v += 'END:VCARD';
  return v;
}

const CREATOR_VCARD = [
  'BEGIN:VCARD', 'VERSION:3.0',
  'N:Artemin Land;;;;', 'FN:Artemin Land', 'ORG:Artemin Land',
  'TITLE:' + vEsc('ساخت کیو آر کد | تولید محتوا | طراحی گرافیک | دکوراسیون داخلی'),
  'TEL;TYPE=CELL:09153136173', 'TEL;TYPE=WORK:09150086173',
  'ADR;TYPE=WORK:;;;' + vEsc('مشهد') + ';;;' + vEsc('ایران'),
  'NOTE:' + vEsc('ساخت کیو آر کد برای شما در هر صنفی | تولید محتوا (اینستاگرام، یوتیوب و همه شبکه‌های اجتماعی) | طراحی گرافیک | دکوراسیون داخلی'),
  'END:VCARD'
].join('\r\n');

function qrUrl(text) {
  return 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&charset-source=UTF-8&data=' + encodeURIComponent(text);
}

// ---------- ارسال فرم ----------
$('form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const t = translations[currentLang];

  if (isSubmitting) { alert(t.alertDuplicate); return; }

  const name = $('name').value.trim();
  const phones = [...document.querySelectorAll('.phone-input')].map(i => normDigits(i.value)).filter(Boolean);
  if (!name || phones.length === 0) { alert(t.alertFill); return; }

  isSubmitting = true;
  $('btn-generate').disabled = true;

  const category = $('category').value;
  const title = $('title-field').value.trim();
  const description = $('description').value.trim();
  const address = $('address').value.trim();
  const checkGoogle = $('check-google').checked;
  const checkNeshan = $('check-neshan').checked;

  lastFormData = { name, phones, title, description, address, category, type: currentType };

  showStatus(t.saving, 'success');
  let saveSuccess = false;
  if (typeof window.saveToFirestore === 'function') {
    try {
      saveSuccess = await Promise.race([
        window.saveToFirestore({
          name, phones, title, description, address, category,
          type: currentType, registerGoogle: checkGoogle, registerNeshan: checkNeshan, hasPhoto: !!photoBase64
        }),
        new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 10000))
      ]);
    } catch (err) {
      console.warn('Save failed or timeout:', err);
    }
  }

  $('qr-main').src = qrUrl(buildVCard(lastFormData));
  $('qr-creator').src = qrUrl(CREATOR_VCARD);

  let info = `<p><strong>${t.name}:</strong> ${esc(name)}</p>`;
  info += `<p><strong>${t.type}:</strong> ${currentType === 'business' ? t.business : t.personal}</p>`;
  info += `<p><strong>${t.phone}:</strong> ${esc(phones.join(' - '))}</p>`;
  if (category) info += `<p><strong>${t.category}:</strong> ${esc(category)}</p>`;
  if (title) info += `<p><strong>${t.title}:</strong> ${esc(title)}</p>`;
  if (description) info += `<p><strong>${t.description}:</strong> ${esc(description)}</p>`;
  if (address) info += `<p><strong>${t.address}:</strong> ${esc(address)}</p>`;
  $('info-main').innerHTML = info;

  $('info-creator').innerHTML =
    `<p><strong>${t.name}:</strong> ${t.creatorName}</p>` +
    `<p><strong>${t.title}:</strong> ${t.creatorTitle}</p>` +
    `<p><strong>${t.phone}:</strong> ${t.creatorPhones}</p>` +
    `<p><strong>${t.address}:</strong> ${t.creatorAddress}</p>`;

  $('btn-google-maps').style.display = checkGoogle ? 'block' : 'none';
  $('btn-neshan-map').style.display = checkNeshan ? 'block' : 'none';
  $('map-section').style.display = (checkGoogle || checkNeshan) ? 'block' : 'none';

  $('result').style.display = 'block';
  $('result').scrollIntoView({ behavior: 'smooth' });
  showStatus(saveSuccess ? t.saved : t.saveFailed, saveSuccess ? 'success' : 'error');

  isSubmitting = false;
  $('btn-generate').disabled = false;
});

// ---------- دانلود ----------
function downloadQR(elementId, filename) {
  const img = $(elementId);
  if (!img.src) { alert(translations[currentLang].noQR); return; }
  fetch(img.src)
    .then(r => r.blob())
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ArteminLand-' + filename + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    })
    .catch(() => window.open(img.src, '_blank'));
}

function downloadCurrentData() {
  const data = { ...lastFormData, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ArteminLand-${(lastFormData.name || 'customer').replace(/[^\w\u0600-\u06FF-]+/g, '_')}-${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
