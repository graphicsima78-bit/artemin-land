<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Artemin Land">
<title>Artemin Land - QR Card Generator</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; 
  background: #f0f2f5; 
  padding: 16px; 
  min-height: 100vh;
  padding-bottom: 80px;
}
.container { 
  max-width: 480px; 
  margin: 0 auto; 
  background: white; 
  border-radius: 16px; 
  padding: 20px; 
  box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
}
h1 { 
  color: #1b5e20; 
  text-align: center; 
  margin-bottom: 20px;
  font-size: 22px;
}
.lang-switch {
  text-align: center;
  margin-bottom: 16px;
}
.lang-btn {
  background: #1976d2;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 14px;
  margin: 0 4px;
}
.lang-btn.active {
  background: #2e7d32;
}
.form-group { margin-bottom: 14px; }
label { 
  display: block; 
  margin-bottom: 6px; 
  font-weight: bold; 
  font-size: 14px;
  color: #333;
}
input, textarea { 
  width: 100%; 
  padding: 12px; 
  border: 2px solid #ddd; 
  border-radius: 8px; 
  font-size: 16px;
  font-family: inherit;
}
input:focus, textarea:focus {
  outline: none;
  border-color: #2e7d32;
}
textarea { resize: vertical; min-height: 60px; }
button { 
  width: 100%; 
  padding: 14px; 
  background: #2e7d32; 
  color: white; 
  border: none; 
  border-radius: 8px; 
  font-size: 16px; 
  font-weight: bold; 
  cursor: pointer;
  margin-top: 8px;
  font-family: inherit;
}
button:hover { background: #1b5e20; }
button:active { transform: scale(0.98); }
button:disabled { background: #999; cursor: wait; }
.btn-location {
  background: #1976d2;
  margin-bottom: 10px;
}
.btn-location:hover { background: #0d47a1; }
#result { 
  display: none; 
  margin-top: 20px; 
  padding-top: 20px; 
  border-top: 2px dashed #ddd; 
  text-align: center; 
}
.qr-section {
  margin: 16px 0;
  padding: 14px;
  background: #f9f9f9;
  border-radius: 12px;
}
.qr-section h3 {
  color: #1b5e20;
  margin-bottom: 10px;
  font-size: 15px;
}
.qr-image { 
  max-width: 200px; 
  width: 100%; 
  border: 8px solid white; 
  box-shadow: 0 2px 8px rgba(0,0,0,0.15); 
  border-radius: 10px; 
  margin: 10px auto; 
  display: block;
  background: white;
}
.info-box {
  background: #e8f5e9;
  padding: 10px;
  border-radius: 8px;
  margin: 10px 0;
  text-align: left;
  border-right: 4px solid #2e7d32;
  font-size: 13px;
}
.info-box p { margin: 5px 0; }
.info-box strong { color: #1b5e20; }
.creator {
  text-align: center;
  margin-top: 20px;
  font-size: 11px;
  color: #777;
}
.hint {
  font-size: 11px;
  color: #666;
  margin-top: 4px;
}
.success-msg {
  color: #2e7d32;
  font-size: 13px;
  margin-top: 6px;
  display: none;
  font-weight: bold;
}
.btn-download {
  background: #1976d2;
  margin-top: 8px;
  padding: 10px;
  font-size: 14px;
}
.btn-download:hover { background: #0d47a1; }
.separator {
  margin: 20px 0;
  border-top: 2px dashed #ccc;
}
.required::after {
  content: " *";
  color: #d32f2f;
}
/* RTL Support */
body.rtl {
  direction: rtl;
}
body.rtl .info-box {
  text-align: right;
  border-right: none;
  border-left: 4px solid #2e7d32;
}
</style>
</head>
<body>
<div class="container">
  <div class="lang-switch">
    <button class="lang-btn active" id="btn-en" onclick="setLang('en')">English</button>
    <button class="lang-btn" id="btn-fa" onclick="setLang('fa')">فارسی</button>
  </div>
  
  <h1 id="title">🟢 Artemin Land<br><small style="font-size:13px;color:#666;">QR Business Card Generator</small></h1>
  
  <form id="form">
    <div class="form-group">
      <label class="required" id="label-name">Business / Person Name</label>
      <input type="text" id="name" required placeholder="e.g. Artemin Store">
    </div>
    
    <div class="form-group">
      <label class="required" id="label-phone">Phone Number</label>
      <input type="tel" id="phone" required placeholder="e.g. 09153136173">
    </div>

    <div class="form-group">
      <label id="label-title">Job Title / Position</label>
      <input type="text" id="title-field" placeholder="e.g. CEO, Manager">
    </div>
    
    <div class="form-group">
      <label id="label-address">Full Address</label>
      <button type="button" class="btn-location" id="locationBtn" onclick="getLocation()">
        📍 <span id="btn-location-text">Use My Current Location</span>
      </button>
      <textarea id="address" rows="2" placeholder="Auto-filled or type manually"></textarea>
      <p class="success-msg" id="locationSuccess">✅ Address detected!</p>
      <p class="hint" id="hint-location">💡 Click button to auto-detect from GPS</p>
    </div>
    
    <button type="submit" id="btn-generate">⚡ Generate QR Codes</button>
  </form>

  <div id="result">
    <h3 style="color:#1b5e20;margin-bottom:10px;" id="result-title">✅ QR Cards Ready!</h3>
    
    <div class="qr-section">
      <h3 id="qr1-title">📱 QR 1: Your Business</h3>
      <p style="font-size:12px;color:#666;margin-bottom:10px;" id="qr1-hint">Scan to save contact</p>
      <img class="qr-image" id="qr-main" alt="Main QR" />
      <div class="info-box" id="info-main"></div>
      <button class="btn-download" onclick="downloadQR('qr-main', 'Main')" id="btn-download1"> Download</button>
    </div>

    <div class="separator"></div>

    <div class="qr-section">
      <h3 id="qr2-title">🛠️ QR 2: Artemin Land</h3>
      <p style="font-size:12px;color:#666;margin-bottom:10px;" id="qr2-hint">Optional: Save creator contact</p>
      <img class="qr-image" id="qr-creator" alt="Creator QR" />
      <div class="info-box" id="info-creator"></div>
      <button class="btn-download" onclick="downloadQR('qr-creator', 'Creator')" id="btn-download2">📥 Download</button>
    </div>
  </div>

  <p class="creator" id="creator-text">
    <strong>Creator:</strong> Artemin Land<br>
    📞 09153136173 | 09150086173 | 09103136173
  </p>
</div>

<script>
// ===== Language Support =====
let currentLang = 'en';

const translations = {
  en: {
    title: '🟢 Artemin Land<br><small style="font-size:13px;color:#666;">QR Business Card Generator</small>',
    labelName: 'Business / Person Name',
    labelPhone: 'Phone Number',
    labelTitle: 'Job Title / Position',
    labelAddress: 'Full Address',
    btnLocation: 'Use My Current Location',
    hintLocation: ' Click button to auto-detect from GPS',
    locationSuccess: '✅ Address detected!',
    btnGenerate: '⚡ Generate QR Codes',
    resultTitle: '✅ QR Cards Ready!',
    qr1Title: '📱 QR 1: Your Business',
    qr1Hint: 'Scan to save contact',
    qr2Title: '🛠️ QR 2: Artemin Land',
    qr2Hint: 'Optional: Save creator contact',
    btnDownload: '📥 Download',
    creatorText: '<strong>Creator:</strong> Artemin Land<br>📞 09153136173 | 09150086173 | 09103136173',
    namePlaceholder: 'e.g. Artemin Store',
    phonePlaceholder: 'e.g. 09153136173',
    titlePlaceholder: 'e.g. CEO, Manager',
    addressPlaceholder: 'Auto-filled or type manually',
    alertFill: 'Please fill Name and Phone!',
    name: 'Name',
    phone: 'Phone',
    title: 'Title',
    address: 'Address',
    type: 'Type',
    mainContact: 'Main Business Contact',
    creatorName: 'Artemin Land',
    creatorTitle: 'QR Code & Content Creation',
    creatorPhones: '09153136173',
    creatorAddress: 'Mashhad, Iran',
    creatorType: 'Service Provider (Optional)',
    noQR: 'No QR!',
    detecting: '⏳ Detecting location...',
    detectingAddress: '🗺️ Detecting address...',
    ipLocation: '🌐 Using IP location...',
    locationError: '⚠️ Could not detect location. Enter manually.',
    locationNotSupported: '❌ Location not supported. Enter manually.'
  },
  fa: {
    title: '🟢 آرتمین لند<br><small style="font-size:13px;color:#666;">ساخت کارت ویزیت دیجیتال (QR)</small>',
    labelName: 'نام کسب‌وکار یا شخص',
    labelPhone: 'شماره تماس',
    labelTitle: 'عنوان شغلی',
    labelAddress: 'آدرس کامل',
    btnLocation: 'استفاده از موقعیت فعلی من',
    hintLocation: ' برای تشخیص خودکار آدرس از GPS کلیک کنید',
    locationSuccess: '✅ آدرس تشخیص داده شد!',
    btnGenerate: '⚡ ساخت کیو آر کد',
    resultTitle: '✅ کیو آر کد آماده است!',
    qr1Title: '📱 کیو آر ۱: کسب‌وکار شما',
    qr1Hint: 'برای ذخیره مخاطب اسکن کنید',
    qr2Title: '🛠️ کیو آر : آرتمین لند',
    qr2Hint: 'اختیاری: ذخیره اطلاعات سازنده',
    btnDownload: '📥 دانلود',
    creatorText: '<strong>سازنده:</strong> آرتمین لند<br>📞 ۰۹۱۵۳۱۳۶۱۷۳ | ۰۹۱۵۰۰۸۶۱۷۳ | ۰۹۱۰۳۱۳۶۱۷۳',
    namePlaceholder: 'مثال: فروشگاه آرتمین',
    phonePlaceholder: 'مثال: 09153136173',
    titlePlaceholder: 'مثال: مدیر عامل',
    addressPlaceholder: 'خودکار پر می‌شود یا دستی وارد کنید',
    alertFill: 'لطفاً نام و تلفن را وارد کنید!',
    name: 'نام',
    phone: 'تلفن',
    title: 'عنوان',
    address: 'آدرس',
    type: 'نوع',
    mainContact: 'مخاطب اصلی کسب‌وکار',
    creatorName: 'آرتمین لند',
    creatorTitle: 'تولید محتوا و ساخت کیو آر کد برای کسب و کار شما',
    creatorPhones: '۰۹۱۵۳۳۶۱۷۳',
    creatorAddress: 'مشهد، ایران',
    creatorType: 'ارائه‌دهنده خدمات (اختیاری)',
    noQR: 'کیو آر کدی وجود ندارد!',
    detecting: '⏳ در حال تشخیص موقعیت...',
    detectingAddress: '🗺️ در حال تشخیص آدرس...',
    ipLocation: ' استفاده از موقعیت IP...',
    locationError: '⚠️ تشخیص موقعیت ممکن نبود. دستی وارد کنید.',
    locationNotSupported: '❌ موقعیت پشتیبانی نمی‌شود. دستی وارد کنید.'
  }
};

function setLang(lang) {
  currentLang = lang;
  const t = translations[lang];
  
  document.getElementById('title').innerHTML = t.title;
  document.getElementById('label-name').textContent = t.labelName;
  document.getElementById('label-phone').textContent = t.labelPhone;
  document.getElementById('label-title').textContent = t.labelTitle;
  document.getElementById('label-address').textContent = t.labelAddress;
  document.getElementById('btn-location-text').textContent = t.btnLocation;
  document.getElementById('hint-location').textContent = t.hintLocation;
  document.getElementById('locationSuccess').textContent = t.locationSuccess;
  document.getElementById('btn-generate').textContent = t.btnGenerate;
  document.getElementById('result-title').textContent = t.resultTitle;
  document.getElementById('qr1-title').textContent = t.qr1Title;
  document.getElementById('qr1-hint').textContent = t.qr1Hint;
  document.getElementById('qr2-title').textContent = t.qr2Title;
  document.getElementById('qr2-hint').textContent = t.qr2Hint;
  document.getElementById('btn-download1').textContent = t.btnDownload;
  document.getElementById('btn-download2').textContent = t.btnDownload;
  document.getElementById('creator-text').innerHTML = t.creatorText;
  
  document.getElementById('name').placeholder = t.namePlaceholder;
  document.getElementById('phone').placeholder = t.phonePlaceholder;
  document.getElementById('title-field').placeholder = t.titlePlaceholder;
  document.getElementById('address').placeholder = t.addressPlaceholder;
  
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-fa').classList.toggle('active', lang === 'fa');
  
  if (lang === 'fa') {
    document.body.classList.add('rtl');
    document.documentElement.lang = 'fa';
    document.documentElement.dir = 'rtl';
  } else {
    document.body.classList.remove('rtl');
    document.documentElement.lang = 'en';
    document.documentElement.dir = 'ltr';
  }
}

// ===== Service Worker =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed:', err));
}

// ===== Location Detection =====
async function getLocation() {
  const btn = document.getElementById('locationBtn');
  const successMsg = document.getElementById('locationSuccess');
  const addressField = document.getElementById('address');
  const t = translations[currentLang];
  
  btn.disabled = true;
  btn.innerHTML = '📍 ' + t.detecting;
  successMsg.style.display = 'none';
  
  if (!navigator.geolocation) {
    alert(t.locationNotSupported);
    resetBtn();
    return;
  }
  
  try {
    const position = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      });
    });
    
    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    
    btn.innerHTML = '📍 ' + t.detectingAddress;
    
    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=fa,en`);
    const data = await response.json();
    
    if (data && data.display_name) {
      addressField.value = data.display_name;
      successMsg.style.display = 'block';
      setTimeout(() => { successMsg.style.display = 'none'; }, 4000);
    } else {
      throw new Error('Address not found');
    }
    
  } catch (error) {
    try {
      btn.innerHTML = '📍 ' + t.ipLocation;
      const ipResponse = await fetch('http://ip-api.com/json/?fields=city,regionName,country');
      const ipData = await ipResponse.json();
      
      if (ipData && ipData.city) {
        addressField.value = `${ipData.city}, ${ipData.regionName}, ${ipData.country}`;
        successMsg.textContent = '✅ Approximate address from IP';
        successMsg.style.display = 'block';
        setTimeout(() => {
          successMsg.style.display = 'none';
        }, 4000);
      } else {
        throw new Error('IP location failed');
      }
    } catch (ipError) {
      alert(t.locationError);
    }
  }
  
  resetBtn();
  
  function resetBtn() {
    btn.disabled = false;
    btn.innerHTML = '📍 ' + t.btnLocation;
  }
}

// ===== QR Generation =====
document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const title = document.getElementById('title-field').value.trim();
  const address = document.getElementById('address').value.trim();
  const t = translations[currentLang];
  
  if (!name || !phone) {
    alert(t.alertFill);
    return;
  }
  
  // QR 1: Main Contact
  let vcard1 = 'BEGIN:VCARD\r\nVERSION:3.0\r\n';
  vcard1 += 'FN:' + name + '\r\n';
  vcard1 += 'ORG:' + name + '\r\n';
  if (title) vcard1 += 'TITLE:' + title + '\r\n';
  vcard1 += 'TEL;TYPE=CELL:' + phone + '\r\n';
  if (address) vcard1 += 'ADR;TYPE=WORK:;;' + address + ';;;;\r\n';
  vcard1 += 'END:VCARD';
  
  const qr1Url = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&charset=UTF-8&data=' + encodeURIComponent(vcard1);
  document.getElementById('qr-main').src = qr1Url;
  
  let info1 = '<p><strong>' + t.name + ':</strong> ' + name + '</p>';
  info1 += '<p><strong>' + t.phone + ':</strong> ' + phone + '</p>';
  if (title) info1 += '<p><strong>' + t.title + ':</strong> ' + title + '</p>';
  if (address) info1 += '<p><strong>' + t.address + ':</strong> ' + address + '</p>';
  document.getElementById('info-main').innerHTML = info1;
  
  // QR 2: Artemin Land
  let vcard2 = 'BEGIN:VCARD\r\nVERSION:3.0\r\n';
  vcard2 += 'FN:Artemin Land\r\n';
  vcard2 += 'ORG:Artemin Land\r\n';
  vcard2 += 'TITLE;CHARSET=UTF-8:تولید محتوا و ساخت کیو آر کد برای کسب و کار شما\r\n';
  vcard2 += 'TEL;TYPE=CELL:09153136173\r\n';
  vcard2 += 'TEL;TYPE=WORK:09150086173\r\n';
  vcard2 += 'TEL;TYPE=OTHER:09103136173\r\n';
  vcard2 += 'ADR;TYPE=WORK;CHARSET=UTF-8:;;مشهد;;;;ایران\r\n';
  vcard2 += 'NOTE;CHARSET=UTF-8:تولید محتوا و ساخت کیو آر کد برای کسب و کار شما\r\n';
  vcard2 += 'END:VCARD';
  
  const qr2Url = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&charset=UTF-8&data=' + encodeURIComponent(vcard2);
  document.getElementById('qr-creator').src = qr2Url;
  
  document.getElementById('info-creator').innerHTML = `
    <p><strong>${t.name}:</strong> ${t.creatorName}</p>
    <p><strong>${t.title}:</strong> ${t.creatorTitle}</p>
    <p><strong>${t.phone}:</strong> ${t.creatorPhones}</p>
    <p><strong>${t.address}:</strong> ${t.creatorAddress}</p>
  `;
  
  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
});

function downloadQR(elementId, filename) {
  const img = document.getElementById(elementId);
  const t = translations[currentLang];
  if (!img.src) { alert(t.noQR); return; }
  
  fetch(img.src)
    .then(response => response.blob())
    .then(blob => {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ArteminLand-' + filename + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    })
    .catch(() => {
      window.open(img.src, '_blank');
    });
}
</script>
</body>
</html>
